  <link rel="stylesheet" href="style.css">
  <style>
    /* CSS Hiệu ứng 3D Đèn Kéo Quân */
    .scene {
      width: 200px;
      height: 260px;
      perspective: 1000px;
      margin: 50px auto;
    }

    .carousel {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      /* Hiệu ứng xoay tự động bằng CSS Keyframes */
      animation: rotateCarousel 15s infinite linear;
    }

    /* Tạm dừng xoay khi rê chuột vào */
    .carousel:hover {
      animation-play-state: paused;
    }

    .carousel__face {
      position: absolute;
      width: 200px;
      height: 260px;
      border: 2px solid #ffd700;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
      background-color: #222;
    }

    .carousel__face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Tạo góc 60 độ cho 6 mặt đèn */
    .carousel__face:nth-child(1) { transform: rotateY(0deg) translateZ(175px); }
    .carousel__face:nth-child(2) { transform: rotateY(60deg) translateZ(175px); }
    .carousel__face:nth-child(3) { transform: rotateY(120deg) translateZ(175px); }
    .carousel__face:nth-child(4) { transform: rotateY(180deg) translateZ(175px); }
    .carousel__face:nth-child(5) { transform: rotateY(240deg) translateZ(175px); }
    .carousel__face:nth-child(6) { transform: rotateY(300deg) translateZ(175px); }

    @keyframes rotateCarousel {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }
  </style>
</head>
